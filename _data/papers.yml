- group: Working papers
  papers:
    - title: School access and city structure
      summary: I study how local school opportunities determine where families live and work, and shape the rest of the city.
      status: New version of my JMP!
      abstract: >-
        The location choices of households with children connect schools to housing and labor markets. I study how school access shapes the internal structure of cities, with a quantitative urban model estimated for Madrid, where parents can apply to any publicly funded school. Decomposing market access reveals that schools, like jobs, draw parents toward the center, but because they are densest there rather than better. To trace the effects of school access, I switch the school allocation rule from free choice to catchment areas, which cut the density advantage of the center. Parents are pushed outward, commute longer, and lose about $7.5\%$ in welfare despite shorter school trips. Citywide, segregation rises, and the reallocation of floorspace use yields slim productivity gains, mostly enjoyed by households without children.
      links:
        - label: pdf
          url: /files/school_access.pdf
